<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅牌抽牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        main {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .input-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }

        .input-section textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .draw-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .draw-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
            min-height: 200px;
        }

        .result-card.initial {
            text-align: center;
            color: #999;
            font-size: 1.1em;
            padding: 50px 30px;
        }

        .question-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .question-display p {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .question-display div {
            color: #333;
            font-style: italic;
        }

        .card-name {
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .orientation-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .orientation-badge.upright {
            background: #4caf50;
            color: white;
        }

        .orientation-badge.reversed {
            background: #ff9800;
            color: white;
        }

        .badge-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-description {
            color: #555;
            line-height: 1.8;
            font-size: 1.05em;
            text-align: center;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            opacity: 0.9;
        }

        footer p {
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
            }

            .input-section, .result-card {
                padding: 20px;
            }

            .card-name {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>✨ 塔羅牌抽牌 ✨</h1>
        <p>傾聽內心的聲音，探索生命的可能</p>
    </header>

    <main>
        <div class="input-section">
            <label for="question">你的問題（可選填）：</label>
            <textarea id="question" placeholder="在此輸入你想問的問題..."></textarea>
        </div>

        <button class="draw-button" onclick="drawCard()">🔮 抽一張牌</button>

        <div id="result" class="result-card initial">
            請按下「抽一張牌」開始占卜
        </div>
    </main>

    <footer>
        <p>💫 此為自我探索工具，僅供參考 💫</p>
    </footer>

    <script>
        // 塔羅牌資料 - 22張大阿爾克那
        const tarotCards = [
            {
                id: 0,
                name: "0. 愚者 (The Fool)",
                upright: "新的開始、冒險精神、天真無邪。這是一個充滿可能性的時刻，勇敢踏出第一步吧！",
                reversed: "魯莽、缺乏計劃、逃避責任。需要更謹慎地思考行動的後果。"
            },
            {
                id: 1,
                name: "1. 魔術師 (The Magician)",
                upright: "創造力、技能、自信。你擁有實現目標所需的一切資源和能力。",
                reversed: "操縱、欺騙、缺乏方向。可能在濫用才能或缺乏自信。"
            },
            {
                id: 2,
                name: "2. 女祭司 (The High Priestess)",
                upright: "直覺、神秘、內在智慧。傾聽你的內在聲音，答案就在心中。",
                reversed: "隱藏秘密、缺乏洞察力、忽視直覺。需要更深入地了解自己的感受。"
            },
            {
                id: 3,
                name: "3. 皇后 (The Empress)",
                upright: "豐饒、養育、美麗。充滿創造力和關愛的能量，適合成長與繁榮。",
                reversed: "依賴、過度保護、創意受阻。需要平衡給予與接受。"
            },
            {
                id: 4,
                name: "4. 皇帝 (The Emperor)",
                upright: "權威、結構、掌控。透過紀律和領導力建立穩定的基礎。",
                reversed: "專制、僵化、失控。權威可能變成壓迫，需要更靈活的態度。"
            },
            {
                id: 5,
                name: "5. 教皇 (The Hierophant)",
                upright: "傳統、精神指導、學習。尋求智慧和遵循既定的道路。",
                reversed: "反叛、挑戰傳統、個人信仰。可能需要打破常規，找到自己的道路。"
            },
            {
                id: 6,
                name: "6. 戀人 (The Lovers)",
                upright: "愛情、和諧、重要選擇。關係中的深刻連結和價值觀的一致。",
                reversed: "不和諧、價值觀衝突、艱難選擇。關係中可能存在分歧。"
            },
            {
                id: 7,
                name: "7. 戰車 (The Chariot)",
                upright: "勝利、決心、前進。克服障礙，朝著目標勇往直前。",
                reversed: "失去方向、缺乏控制、挫敗。需要重新評估目標和方法。"
            },
            {
                id: 8,
                name: "8. 力量 (Strength)",
                upright: "勇氣、耐心、內在力量。以溫柔而堅定的方式克服挑戰。",
                reversed: "自我懷疑、缺乏信心、內在衝突。需要重新建立自信。"
            },
            {
                id: 9,
                name: "9. 隱者 (The Hermit)",
                upright: "內省、獨處、尋求真理。退一步思考，尋找內在的智慧。",
                reversed: "孤立、孤獨、迷失。可能過度隔離或拒絕他人的建議。"
            },
            {
                id: 10,
                name: "10. 命運之輪 (Wheel of Fortune)",
                upright: "變化、命運、好運。生命的循環帶來新的機會。",
                reversed: "厄運、抗拒變化、失控。需要接受改變並適應新情況。"
            },
            {
                id: 11,
                name: "11. 正義 (Justice)",
                upright: "公平、真相、因果。行為的結果將會顯現，保持誠實和公正。",
                reversed: "不公、逃避責任、偏見。可能面臨不公平的對待或需要反省自己的行為。"
            },
            {
                id: 12,
                name: "12. 倒吊人 (The Hanged Man)",
                upright: "暫停、放手、新視角。從不同角度看待事物，耐心等待。",
                reversed: "拖延、抗拒、無謂犧牲。可能困在僵局中，需要採取行動。"
            },
            {
                id: 13,
                name: "13. 死神 (Death)",
                upright: "結束、轉變、重生。舊事物的終結為新開始創造空間。",
                reversed: "抗拒改變、停滯、無法放手。需要接受終結才能向前邁進。"
            },
            {
                id: 14,
                name: "14. 節制 (Temperance)",
                upright: "平衡、調和、耐心。尋找中庸之道，整合對立的元素。",
                reversed: "失衡、過度、缺乏和諧。需要恢復生活的平衡。"
            },
            {
                id: 15,
                name: "15. 惡魔 (The Devil)",
                upright: "束縛、誘惑、物質主義。意識到限制你的枷鎖，才能獲得自由。",
                reversed: "解放、覺醒、打破束縛。正在擺脫負面模式和依賴。"
            },
            {
                id: 16,
                name: "16. 塔 (The Tower)",
                upright: "突然改變、混亂、啟示。舊結構的崩塌帶來必要的轉變。",
                reversed: "逃避災難、恐懼改變、延遲崩潰。改變雖然推遲但終將到來。"
            },
            {
                id: 17,
                name: "17. 星星 (The Star)",
                upright: "希望、靈感、寧靜。在黑暗後看見光明，保持信念和樂觀。",
                reversed: "失去信心、絕望、缺乏靈感。需要重新點燃內心的希望。"
            },
            {
                id: 18,
                name: "18. 月亮 (The Moon)",
                upright: "幻覺、恐懼、潛意識。面對內心的恐懼和不確定性。",
                reversed: "釋放恐懼、找到清晰、克服幻覺。逐漸看清真相。"
            },
            {
                id: 19,
                name: "19. 太陽 (The Sun)",
                upright: "成功、喜悅、活力。充滿正面能量，一切都在朝好的方向發展。",
                reversed: "過度樂觀、延遲的成功、缺乏熱情。喜悅可能被暫時遮蔽。"
            },
            {
                id: 20,
                name: "20. 審判 (Judgement)",
                upright: "覺醒、重生、內在呼喚。是時候評估過去，做出重要決定。",
                reversed: "自我懷疑、缺乏反省、逃避評判。難以原諒自己或他人。"
            },
            {
                id: 21,
                name: "21. 世界 (The World)",
                upright: "完成、成就、圓滿。一個循環的結束，帶著成就感邁向新階段。",
                reversed: "未完成、缺乏閉合、延遲成功。接近目標但還需要最後的努力。"
            }
        ];

        // 抽牌函數
        function drawCard() {
            // 隨機選擇一張牌
            const cardIndex = Math.floor(Math.random() * tarotCards.length);
            const selectedCard = tarotCards[cardIndex];
            
            // 隨機決定正位或逆位
            const isReversed = Math.random() < 0.5;
            const orientation = isReversed ? 'reversed' : 'upright';
            const orientationText = isReversed ? '逆位' : '正位';
            
            // 取得對應的描述
            const description = isReversed ? selectedCard.reversed : selectedCard.upright;
            
            // 取得問題
            const question = document.getElementById('question').value.trim();
            
            // 建立結果HTML
            let resultHTML = '';
            
            // 如果有輸入問題，顯示問題區塊
            if (question) {
                resultHTML += `
                    <div class="question-display">
                        <p>你的問題：</p>
                        <div>${question}</div>
                    </div>
                `;
            }
            
            resultHTML += `
                <h2 class="card-name">${selectedCard.name}</h2>
                <div class="badge-container">
                    <span class="orientation-badge ${orientation}">${orientationText}</span>
                </div>
                <p class="card-description">${description}</p>
            `;
            
            // 更新結果區域
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result-card';
            resultDiv.innerHTML = resultHTML;
        }
    </script>
</body>
</html>
